{% extends 'base.html' %}{% block content %}<section class="form-page"><a href="{{ url_for('item_detail',item_id=item.id) }}">← {{ item.title }}</a><span class="eyebrow">01 / WRITE YOUR REVIEW</span><h1>Your experience<br><em>helps the next person.</em></h1><p>We’ll suggest a recommendation from your words. You choose the final answer before publishing.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label for="title">Review title</label><input id="title" name="title" required maxlength="150" value="{{ request.form.get('title','') }}"><label for="body">Your review</label><textarea id="body" name="body" required maxlength="5000" rows="7">{{ request.form.get('body','') }}</textarea><label for="rating">Your rating</label><select id="rating" name="rating" required><option value="">Choose a rating</option>{% for n in range(1,6) %}<option value="{{ n }}" {% if request.form.get('rating')==n|string %}selected{% endif %}>{{ n }} / 5</option>{% endfor %}</select><button>Preview model suggestion →</button></form></section>{% endblock %}
